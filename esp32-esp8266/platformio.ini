; ESP32 BLE beacon and RSSI collection firmware (specs/002-esp32-ble-firmware).
; No secrets in this file: credentials live in include/config.h (ignored by git).
;
; Versions: pinned to the exact versions resolved by the first successful build (task T008,
; 2026-10-21): platform espressif32 8.0.0 (Arduino-ESP32 core 3.x, GCC 14.2), NimBLE-Arduino
; 2.5.1, espMqttClient 1.7.3 and its dependency AsyncTCP 3.5.0.

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32@8.0.0
framework = arduino
board = esp32dev
monitor_speed = 9600
; The default two-OTA-slot partition table leaves ~1.25MB for the app, which HTTPClient's TLS
; stack (mbedTLS, pulled in for POST /fingerprints over HTTPS) overflows by itself. huge_app.csv
; gives the app ~3MB instead, at the cost of OTA updates — not needed here, boards are flashed
; over USB.
board_build.partitions = huge_app.csv
; The firmware uses C++17.
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
lib_deps =
    h2zero/NimBLE-Arduino@2.5.1
    bertmelis/espMqttClient@1.7.3
    ESP32Async/AsyncTCP@3.5.0

; Host-side unit tests (Unity) for the portable logic in lib/domain and for the roles and the
; supervisor of src/app, which depend only on the pure interfaces of src/hal. No board needed.
; Only the hardware-free source files are built here; add each new pure file to the filter.
[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_src_filter =
    -<*>
    +<app/supervisor.cpp>
    +<app/role_factory.cpp>
    +<app/beacon_role.cpp>
    +<app/record_task.cpp>
    +<app/collector_role.cpp>
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
    -I src

name: Android

on:
  push:
    branches: [master]
    paths:
      - "applications/android/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "applications/android/**"
      - ".github/workflows/android.yml"

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: applications/android
    steps:
      - uses: actions/checkout@v4

      # The Gradle daemon asks for JDK 21 (gradle/gradle-daemon-jvm.properties).
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # Secrets.kt is gitignored but compiled in; the placeholder from the example is enough to
      # build and test (nothing here talks to the real API) — same thing `make setup` does.
      - name: Secrets.kt from its example
        run: cp app/src/main/java/br/org/cesar/blueguide/core/network/http/Secrets.kt.example app/src/main/java/br/org/cesar/blueguide/core/network/http/Secrets.kt

      - name: Formatting, lint, unit tests and debug build
        run: ./gradlew --console=plain spotlessCheck lintDebug testDebugUnitTest assembleDebug

      - name: Reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: applications/android/app/build/reports

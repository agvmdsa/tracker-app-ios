apiVersion: 1

datasources:
  - name: Positioning Postgres
    uid: positioning-postgres
    type: postgres
    access: proxy
    url: $POSTGRES_HOST:$POSTGRES_PORT
    database: $POSTGRES_DB
    user: $POSTGRES_USER
    isDefault: true
    editable: true
    jsonData:
      sslmode: $POSTGRES_SSLMODE
      postgresVersion: 1600
      timescaledb: false
    secureJsonData:
      password: $POSTGRES_PASSWORD
